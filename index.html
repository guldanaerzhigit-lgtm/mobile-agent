<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2f80ed" />
  <meta name="description" content="Agent — современный мессенджер в стиле классического Mail.ru Агента" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%232f80ed%22/><path d=%22M25 65 50 22l25 43-25-9z%22 fill=%22white%22/></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <title>Agent</title>
</head>
<body>
  <div id="toast" class="toast"></div>
  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="brand-mark">A</div>
      <h1>Agent</h1>
      <p class="muted">Общайся с друзьями быстро и удобно</p>
      <form id="authForm">
        <input id="email" type="email" placeholder="Email" autocomplete="email" required />
        <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" minlength="6" required />
        <input id="displayName" class="register-only" type="text" placeholder="Имя" autocomplete="name" />
        <button class="primary" type="submit"><span id="authSubmitText">Войти</span></button>
      </form>
      <button id="toggleAuth" class="link-button">Нет аккаунта? Зарегистрироваться</button>
      <p id="authError" class="error"></p>
    </div>
  </section>

  <section id="appView" class="app-view hidden">
    <aside class="sidebar">
      <header class="sidebar-head">
        <div class="me" id="profileButton">
          <div class="avatar" id="myAvatar">A</div>
          <div class="me-text"><strong id="myName">Пользователь</strong><small id="myStatus">Онлайн</small></div>
        </div>
        <button id="settingsButton" class="icon-btn" title="Настройки">⚙</button>
      </header>
      <div class="search-wrap"><input id="userSearch" placeholder="Поиск пользователей" /></div>
      <div class="tabs"><button class="tab active" data-tab="chats">Чаты</button><button class="tab" data-tab="contacts">Контакты</button></div>
      <div id="contactList" class="list"></div>
    </aside>

    <main class="chat-panel">
      <header id="chatHeader" class="chat-head empty"><div>Выберите чат</div></header>
      <div id="messages" class="messages"><div class="empty-state"><div class="empty-icon">💬</div><h2>Agent</h2><p>Выберите пользователя слева, чтобы начать общение.</p></div></div>
      <form id="messageForm" class="composer hidden">
        <input id="fileInput" type="file" hidden multiple />
        <button type="button" id="attachButton" class="icon-btn" title="Файл">📎</button>
        <input id="messageInput" autocomplete="off" placeholder="Напишите сообщение..." />
        <button type="button" id="emojiButton" class="icon-btn" title="Emoji">😊</button>
        <button type="submit" class="send-btn" title="Отправить">➤</button>
      </form>
    </main>

    <aside id="detailsPanel" class="details hidden">
      <div class="details-avatar avatar large" id="detailsAvatar">A</div>
      <h3 id="detailsName">Пользователь</h3>
      <p id="detailsStatus" class="muted">Онлайн</p>
      <button id="callAudio" class="secondary">📞 Аудиозвонок</button>
      <button id="callVideo" class="secondary">🎥 Видеозвонок</button>
    </aside>
  </section>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><h3>Настройки</h3><button id="closeSettings" class="icon-btn">×</button></div>
      <label>Имя<input id="settingsName" /></label>
      <label>Статус<select id="settingsStatus"><option value="online">Онлайн</option><option value="away">Отошёл</option><option value="dnd">Не беспокоить</option><option value="invisible">Невидимый</option></select></label>
      <label class="switch-row"><span>Тёмная тема</span><input id="darkMode" type="checkbox" /></label>
      <button id="saveSettings" class="primary">Сохранить</button>
      <button id="logoutButton" class="danger">Выйти</button>
    </div>
  </div>

  <div id="callModal" class="modal hidden"><div class="call-card"><div class="call-avatar avatar large" id="callAvatar">A</div><h2 id="callTitle">Звонок</h2><p id="callState">Подготовка...</p><div class="call-video"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video></div><button id="hangupButton" class="hangup">Завершить</button></div></div>

  <script type="module" src="app.js"></script>
</body>
</html>
